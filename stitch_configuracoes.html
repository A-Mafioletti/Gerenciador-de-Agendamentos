<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#16439c",
              "background-light": "#f6f6f8",
              "background-dark": "#111621",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Checkbox Tick */
        .custom-checkbox:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-10 bg-background-light dark:bg-background-dark border-b border-slate-200 dark:border-slate-800 px-4 py-4 flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight">Configurações e Disponibilidade</h1>
</header>
<main class="flex-1 overflow-y-auto pb-32">
<!-- Section A: Dias da Semana -->
<section class="p-4 border-b border-slate-200 dark:border-slate-800">
<h2 class="text-sm font-semibold uppercase tracking-wider text-primary mb-4">Seção A: Dias de Trabalho</h2>
<div class="space-y-1">
<label class="flex items-center justify-between py-3 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium">Segunda-feira</span>
<input checked="" class="custom-checkbox h-6 w-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between py-3 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium">Terça-feira</span>
<input checked="" class="custom-checkbox h-6 w-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between py-3 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium">Quarta-feira</span>
<input checked="" class="custom-checkbox h-6 w-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between py-3 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium">Quinta-feira</span>
<input checked="" class="custom-checkbox h-6 w-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between py-3 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium">Sexta-feira</span>
<input checked="" class="custom-checkbox h-6 w-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between py-3 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium text-slate-400">Sábado</span>
<input class="custom-checkbox h-6 w-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between py-3 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium text-slate-400">Domingo</span>
<input class="custom-checkbox h-6 w-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" type="checkbox"/>
</label>
</div>
</section>
<!-- Section B: Horários -->
<section class="p-4 border-b border-slate-200 dark:border-slate-800">
<h2 class="text-sm font-semibold uppercase tracking-wider text-primary mb-4">Seção B: Horários</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-slate-500">Início do Expediente</label>
<div class="relative">
<input class="w-full rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary p-3" type="time" value="08:00"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-slate-500">Término do Expediente</label>
<div class="relative">
<input class="w-full rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary p-3" type="time" value="18:00"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-slate-500">Intervalo / Pausa</label>
<div class="relative">
<input class="w-full rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary p-3" type="time" value="12:00"/>
</div>
</div>
</div>
</section>
<!-- Section C: Lista de Serviços -->
<section class="p-4">
<div class="flex items-center justify-between mb-4">
<h2 class="text-sm font-semibold uppercase tracking-wider text-primary">Seção C: Serviços</h2>
<button class="flex items-center gap-1 text-sm font-bold text-primary hover:underline">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
                    Adicionar Novo Serviço
                </button>
</div>
<div class="space-y-3">
<!-- Service Item 1 -->
<div class="flex items-center gap-3 p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
<div class="flex-1">
<h4 class="font-semibold text-slate-900 dark:text-white">Corte de Cabelo Masculino</h4>
<div class="flex items-center gap-1.5 text-slate-500 text-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                            30 min
                        </div>
</div>
<button class="p-2 text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Service Item 2 -->
<div class="flex items-center gap-3 p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
<div class="flex-1">
<h4 class="font-semibold text-slate-900 dark:text-white">Barba e Toalha Quente</h4>
<div class="flex items-center gap-1.5 text-slate-500 text-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                            45 min
                        </div>
</div>
<button class="p-2 text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Service Item 3 -->
<div class="flex items-center gap-3 p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
<div class="flex-1">
<h4 class="font-semibold text-slate-900 dark:text-white">Combo: Corte + Barba</h4>
<div class="flex items-center gap-1.5 text-slate-500 text-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                            1h 15 min
                        </div>
</div>
<button class="p-2 text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</section>
</main>
<!-- Fixed Footer Actions -->
<div class="fixed bottom-0 left-0 w-full z-20">
<!-- Main Action Button -->
<div class="px-4 pb-4">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all">
                Salvar Configurações
            </button>
</div>
<!-- Bottom Tab Bar -->
<nav class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-4 pb-6 pt-2 flex justify-around items-center">
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Agenda</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">group</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Clientes</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Ajustes</span>
</a>
</nav>
</div>
</body></html>
